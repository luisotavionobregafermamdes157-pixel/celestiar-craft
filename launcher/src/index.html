<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celestiar Launcher</title><style>body{margin:0;background:#10131a;color:#fff;font-family:Arial,sans-serif}header{padding:24px 32px;background:#171b24}main{padding:32px;max-width:1000px;margin:auto}.card{background:#191e28;border:1px solid #2a3140;border-radius:16px;padding:24px;margin-bottom:20px}select,button{font-size:16px;padding:12px;border-radius:10px;border:0}select{background:#0f131b;color:white;width:100%;margin:10px 0}button{background:#3b82f6;color:#fff;cursor:pointer}#status{margin-top:15px;color:#9ca3af}</style></head><body><header><h1>⛏️ Celestiar Launcher</h1><span>Minecraft Java Edition</span></header><main><div class="card"><h2>Escolher versão</h2><select id="versions"><option>Carregando versões...</option></select><button id="refresh">Atualizar versões</button><button id="play">Jogar</button><div id="status">Pronto.</div></div><div class="card"><h2>Recursos</h2><p>Versões oficiais • Perfis separados • Preparado para mod loaders</p></div></main><script>const select=document.querySelector('#versions'),status=document.querySelector('#status');async function load(){try{status.textContent='Buscando versões oficiais...';const url=await window.launcher.getVersionManifestUrl();const r=await fetch(url);if(!r.ok)throw Error('manifest '+r.status);const data=await r.json();select.innerHTML='';for(const v of data.versions){const o=document.createElement('option');o.value=v.id;o.textContent=v.id+' — '+v.type;select.appendChild(o)}status.textContent=`${data.versions.length} versões encontradas.`}catch(e){status.textContent='Erro ao carregar versões: '+e.message}}document.querySelector('#refresh').onclick=load;document.querySelector('#play').onclick=()=>status.textContent='Versão selecionada: '+select.value+'. Sistema de download será conectado na próxima etapa.';load();</script></body></html>
